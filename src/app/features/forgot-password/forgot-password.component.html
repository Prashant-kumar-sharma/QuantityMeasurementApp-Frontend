<div class="auth-viewport">
  <div class="auth-card fade-in">
    <div class="auth-header">
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">
        No worries! Enter your email address and we'll send you a link to reset your password.
      </p>
    </div>

    <!-- Success Message -->
    <div class="success-message" *ngIf="successMessage">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>{{ successMessage }}</span>
    </div>

    <!-- Error Message -->
    <div class="error-message" *ngIf="errorMessage">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-field">
        <label for="email">Email Address</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="name@example.com"
          [class.error-border]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
        />
        <div class="field-error" *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
          <span *ngIf="forgotForm.get('email')?.errors?.['required']">Email is required.</span>
          <span *ngIf="forgotForm.get('email')?.errors?.['email']">Please enter a valid email address.</span>
        </div>
      </div>

      <button type="submit" class="btn-primary auth-submit" [disabled]="isLoading">
        {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Remember your password? <a routerLink="/login" class="back-to-login">Back to Login</a></p>
    </div>
  </div>
</div>
