<div class="auth-viewport">
  <div class="auth-card fade-in">
    <div class="auth-header">
      <h1 class="auth-title">Set New Password</h1>
      <p class="auth-subtitle">
        Create a strong password for your account.
      </p>
    </div>

    <!-- Success Message -->
    <div class="success-message" *ngIf="successMessage">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>{{ successMessage }}</span>
    </div>

    <!-- Error Message -->
    <div class="error-message" *ngIf="errorMessage">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form" *ngIf="token">
      <!-- New Password -->
      <div class="form-field">
        <label for="newPassword">New Password</label>
        <div class="password-wrapper">
          <input 
            id="newPassword" 
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="newPassword" 
            placeholder="Enter new password"
            [class.error-border]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
          />
          <button type="button" class="visibility-btn" (click)="togglePasswordVisibility()">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M6.71 6.71C4.47 7.93 2 12 2 12s3 7 10 7c2 0 3.69-.5 5.12-1.38"/><path d="M15.1 9.4a3 3 0 0 0-4.5 4.5"/><path d="M9 4.58C10 4.2 11 4 12 4c7 0 11 8 11 8s-2 3.51-4.59 5.82"/></svg>
          </button>
        </div>
        <div class="field-error" *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">
          <span *ngIf="resetForm.get('newPassword')?.errors?.['required']">Password is required.</span>
          <span *ngIf="resetForm.get('newPassword')?.errors?.['minlength']">Password must be at least 6 characters.</span>
          <span *ngIf="resetForm.get('newPassword')?.errors?.['maxlength']">Password cannot exceed 20 characters.</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input 
            id="confirmPassword" 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            formControlName="confirmPassword" 
            placeholder="Confirm new password"
            [class.error-border]="(resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched) || resetForm.errors?.['passwordMismatch']"
          />
          <button type="button" class="visibility-btn" (click)="toggleConfirmPasswordVisibility()">
            <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M6.71 6.71C4.47 7.93 2 12 2 12s3 7 10 7c2 0 3.69-.5 5.12-1.38"/><path d="M15.1 9.4a3 3 0 0 0-4.5 4.5"/><path d="M9 4.58C10 4.2 11 4 12 4c7 0 11 8 11 8s-2 3.51-4.59 5.82"/></svg>
          </button>
        </div>
        <div class="field-error" *ngIf="resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched">
          <span *ngIf="resetForm.get('confirmPassword')?.errors?.['required']">Please confirm your password.</span>
        </div>
        <div class="field-error" *ngIf="resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched">
          Passwords do not match.
        </div>
      </div>

      <button type="submit" class="btn-primary auth-submit" [disabled]="isLoading">
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Remember your password? <a routerLink="/login" class="back-to-login">Back to Login</a></p>
    </div>
  </div>
</div>
