<div class="auth-viewport">
  <div class="auth-card fade-in">
    <div class="auth-header">
      <h1 class="auth-title">Welcome</h1>
      <p class="auth-subtitle">
        {{ activeTab === 'login' ? 'Sign in to your account' : 'Create a new account' }}
      </p>

      <!-- Minimal Toggle -->
      <div class="minimal-toggle">
        <button type="button" [class.active]="activeTab === 'login'" (click)="toggleTab('login')">Login</button>
        <button type="button" [class.active]="activeTab === 'signup'" (click)="toggleTab('signup')">Sign Up</button>
      </div>
    </div>

    <!-- Login/Signup Form -->
    <form [formGroup]="activeTab === 'login' ? loginForm : signupForm" (ngSubmit)="onSubmit()" class="auth-form">
      
      <!-- Signup: Name -->
      <div class="form-field fade-in" *ngIf="activeTab === 'signup'">
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" formControlName="fullName" placeholder="John Doe" 
               [class.error-border]="backendErrors.firstName || backendErrors.lastName"
               (blur)="autoCapitalizeName()" />
        <div class="field-error" *ngIf="backendErrors.firstName">{{ backendErrors.firstName }}</div>
        <div class="field-error" *ngIf="backendErrors.lastName">{{ backendErrors.lastName }}</div>
      </div>

      <!-- Email (Common) -->
      <div class="form-field">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" placeholder="name@example.com" 
               [class.error-border]="backendErrors.email" />
        <div class="field-error" *ngIf="backendErrors.email">{{ backendErrors.email }}</div>
      </div>

      <!-- Signup: Mobile -->
      <div class="form-field fade-in" *ngIf="activeTab === 'signup'">
        <label for="mobileNo">Mobile Number</label>
        <input id="mobileNo" type="tel" formControlName="mobileNo" placeholder="10-digit mobile" 
               [class.error-border]="backendErrors.mobileNo" />
        <div class="field-error" *ngIf="backendErrors.mobileNo">{{ backendErrors.mobileNo }}</div>
      </div>

      <!-- Password (Common) -->
        <div class="form-field">
          <div class="password-label-row">
            <label for="password">Password</label>
            <a routerLink="/forgot-password" class="forgot-password-link">Forgot Password?</a>
          </div>
          <div class="password-wrapper">
            <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••" 
                   [class.error-border]="backendErrors.password" />
            <button type="button" class="visibility-btn" (click)="togglePasswordVisibility()">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M6.71 6.71C4.47 7.93 2 12 2 12s3 7 10 7c2 0 3.69-.5 5.12-1.38"/><path d="M15.1 9.4a3 3 0 0 0-4.5 4.5"/><path d="M9 4.58C10 4.2 11 4 12 4c7 0 11 8 11 8s-2 3.51-4.59 5.82"/></svg>
            </button>
          </div>
          <div class="field-error" *ngIf="backendErrors.password">{{ backendErrors.password }}</div>
        </div>

      <!-- Signup: Confirm Password -->
      <div class="form-field fade-in" *ngIf="activeTab === 'signup'">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="••••••••" 
               [class.error-border]="backendErrors.confirmPassword" />
        <div class="field-error" *ngIf="backendErrors.confirmPassword">{{ backendErrors.confirmPassword }}</div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary auth-submit" [disabled]="isLoading">
        {{ isLoading ? 'Processing...' : (activeTab === 'login' ? 'Sign In' : 'Create Account') }}
      </button>

      <!-- OR Divider -->
      <div class="auth-divider">
        <div class="divider-line"></div>
        <span>OR</span>
        <div class="divider-line"></div>
      </div>

      <!-- Google Button -->
      <button type="button" (click)="loginWithGoogle()" class="btn-google">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
    </form>
  </div>
</div>
