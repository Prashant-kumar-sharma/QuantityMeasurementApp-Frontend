<div class="converter-wrapper">
  <div class="converter-container fade-in">
    <div class="conversion-row">
      <!-- Source Magnitude -->
      <div class="field-group">
        <label for="fromValue">Magnitude</label>
        <input 
          id="fromValue"
          type="number" 
          [(ngModel)]="fromValue" 
          placeholder="0.00" />
      </div>

      <!-- Base Unit Selector -->
      <div class="field-group">
        <label for="fromUnit">Base Unit</label>
        <select id="fromUnit" [(ngModel)]="fromUnit">
          <option *ngFor="let u of currentUnits" [value]="u">
            {{ u | titlecase }}
          </option>
        </select>
      </div>

      <!-- Arrow Divider -->
      <div class="separator">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </div>

      <!-- Target Unit Selector -->
      <div class="field-group">
        <label for="toUnit">Target Unit</label>
        <select id="toUnit" [(ngModel)]="toUnit">
          <option *ngFor="let u of currentUnits" [value]="u">
            {{ u | titlecase }}
          </option>
        </select>
      </div>
    </div>

    <!-- Result Section -->
    <div class="result-section">
      <div class="result-box" [class.has-value]="toValue !== null">
        <span class="result-label">Calculated Result</span>
        <div class="result-value">
          {{ toValue !== null ? (toValue | number:'1.2-4') : '---' }}
        </div>
      </div>
    </div>

    <!-- Action Button (Repositioned directly below result) -->
    <div class="action-footer">
      <button class="btn-primary" (click)="convert()" [disabled]="isConverting">
        {{ isConverting ? 'Converting...' : 'Convert' }}
      </button>
      
      <div *ngIf="conversionError" class="error-msg fade-in">
        {{ conversionError }}
      </div>
    </div>
  </div>
</div>
