<div class="app-shell">
  <!-- Clean Background -->

  <nav class="main-nav" [class.nav-hidden]="!isNavbarVisible">
    <div class="nav-container">
      <div class="brand" routerLink="/dashboard" (click)="goToDashboard()" role="button" tabindex="0" aria-label="Go to Dashboard">
        <h1 class="brand-name">
        Quantity<span class="text-accent">Measurement</span>
        </h1>
      </div>

      <div class="nav-actions">
        <div *ngIf="isAuthenticated$ | async" class="user-info fade-in">
          <ng-container *ngIf="currentUser$ | async as user">
            <div class="user-profile" [title]="getUserDisplayName(user)">
              <div class="avatar-container">
                <ng-container *ngIf="userAvatar$ | async as avatarUrl; else fallbackAvatar">
                  <img 
                    [src]="avatarUrl" 
                    alt="{{ getUserDisplayName(user) }}" 
                    class="nav-avatar"
                    (error)="onAvatarError()"
                    *ngIf="avatarLoaded"
                  />
                  <div *ngIf="!avatarLoaded" class="avatar-placeholder">{{ getAvatarInitial(user) }}</div>
                </ng-container>
                <ng-template #fallbackAvatar>
                  <div class="avatar-placeholder">{{ getAvatarInitial(user) }}</div>
                </ng-template>
              </div>
              <span class="user-display-name">{{ getUserDisplayName(user) }}</span>
            </div>
          </ng-container>
          <button class="nav-btn logout" (click)="logout()" title="Secure Logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>

        <div *ngIf="!(isAuthenticated$ | async)" class="auth-buttons fade-in">
          <button class="nav-btn secondary" (click)="goToLogin()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            <span>Sign In</span>
          </button>
        </div>
      </div>

    </div>
  </nav>

  <main class="app-content container">
    <router-outlet></router-outlet>
  </main>

  <!-- Toast Container -->
  <div id="toast-container"></div>
</div>
